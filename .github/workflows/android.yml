# 安卓构建验证（04-CICD与验证边界.md §3）。
#
# 为什么 paths 过滤是必要的：本机没有 Android 工具链，编译只能靠云端；
# 但反过来，每次改后端文档都白跑一遍 Gradle 是纯浪费。
#
# 为什么"打 tag 出 Release"不放在这个文件里，而是单独一个 android-release.yml：
# 同一个 push 触发器里 `paths` 与 `tags` 同时存在时，路径过滤对 tag 推送是否生效
# 在文档里没有直白说明。赌错的后果是"打了 tag 却不发 Release"这种静默失效。
# 拆成两个 workflow 后，两边的触发条件都无歧义。
name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      selftest_signing:
        description: "签名自检：用一次性测试 keystore 验证签名流水线（不读 secret，产物不是正式包）"
        type: boolean
        default: false

# 同一分支连续推送时取消上一轮，省 Actions 额度
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # GitHub 托管 runner 自带 Android SDK（ANDROID_HOME 已设，含 build-tools 34–37
      # 与 platforms android-34~37，见 04-CICD与验证边界.md §2.1），
      # 因此这里**不需要**任何 SDK 安装步骤。
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 负责 Gradle 缓存：首次构建慢，之后靠缓存。
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # 资源层面的错误（XML 不合法、@string 引用写错）不需要编译器就能查出来，
      # 而且 CI 一轮要几分钟。放最前面，让最低级的错误以最快速度失败。
      - name: 资源预检
        run: python3 android/tools/check_resources.py

      # 固定 release keystore（决策 8）从 4 个 secret 还原。
      # 没有 secret 时不失败，而是退回 debug 签名 —— 这样"还没配密钥"不会
      # 阻塞编译验证；但会打一条醒目的警告，因为 debug 签名的 APK 每次构建
      # 签名都不同，**无法覆盖升级**（每次都得卸载重装，本地数据与订阅全丢）。
      #
      # `selftest_signing` 是给"签名流水线本身是不是通的"用的：在没有配置 secret
      # 的情况下，用 runner 上现生成的一次性 keystore 走完全相同的路径
      # （还原 → keytool 校验 → gradle 用 ORIDESK_KEYSTORE_PATH 签名）。
      # 这样能把「签名配置写错了」与「secret 还没配」两类问题分开 —— 
      # 与 E6 测试推送端点把「推送不通」和「App 有问题」分开是同一个思路。
      # 它**不产出正式包**：测试 keystore 是临时的、口令是公开的。
      - name: 还原签名密钥
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ] && [ "${{ inputs.selftest_signing }}" = "true" ]; then
            echo "::notice title=签名自检::未配置 secret，改用一次性测试 keystore 验证签名流水线。产物仅供验证，不是正式发布包。"
            keytool -genkeypair \
              -keystore "${RUNNER_TEMP}/oridesk-release.p12" \
              -storetype PKCS12 \
              -alias oridesk \
              -keyalg RSA -keysize 2048 -validity 30 \
              -storepass selftest -keypass selftest \
              -dname "CN=OriDesk Signing Selftest, O=OriDesk"
            echo "ORIDESK_KEYSTORE_PATH=${RUNNER_TEMP}/oridesk-release.p12" >> "$GITHUB_ENV"
            echo "ORIDESK_KEYSTORE_PASSWORD=selftest" >> "$GITHUB_ENV"
            echo "ORIDESK_KEY_ALIAS=oridesk" >> "$GITHUB_ENV"
            echo "ORIDESK_KEY_PASSWORD=selftest" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "selftest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::warning title=未配置签名密钥::KEYSTORE_BASE64 为空，本次产出 debug 签名 APK，无法覆盖升级。请在仓库 Settings → Secrets 里配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD。"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 只写文件，绝不 echo 内容 —— 这是长期签名密钥，泄漏等于别人可以
          # 签出能覆盖安装到你手机上的"升级包"。
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/oridesk-release.p12"
          echo "ORIDESK_KEYSTORE_PATH=${RUNNER_TEMP}/oridesk-release.p12" >> "$GITHUB_ENV"
          echo "ORIDESK_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "ORIDESK_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "ORIDESK_KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # 校验还原出来的 keystore 真的可用。
      # 只输出别名与证书指纹（都是公开信息），**绝不输出密钥或口令** ——
      # 这是长期签名密钥，泄漏等于别人可以签出能覆盖安装到用户手机上的"升级包"。
      # 这一步把"keystore 格式或口令不对"从"打包到最后一刻才炸"提前到构建最开始。
      - name: 校验签名密钥
        if: steps.keystore.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore "${ORIDESK_KEYSTORE_PATH}" \
            -storetype PKCS12 \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEY_ALIAS}"

      - name: 编译 Debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: 编译 Release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # 「构建成功」不等于「签名成功」：gradle 不会因为签名配置没生效而失败，
      # 它会安静地产出一个未签名（或 debug 签名）的 release 包。
      # 所以这里用 apksigner 检查**产物本身**的签名方案与证书指纹。
      - name: 验证 Release APK 的签名
        if: steps.keystore.outputs.signed == 'true'
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "检查 $APK"
          # apksigner 在 runner 自带的 SDK 里；它以退出码表达校验结果。
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | tee /tmp/apksigner.txt
          if [ "${{ steps.keystore.outputs.selftest }}" = "true" ]; then
            echo "::notice::这是签名**自检**产物（一次性测试 keystore），不要用于分发。"
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: oridesk-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 签名状态直接写进 job 摘要：这样"我拿到的这个 APK 能不能覆盖升级"
      # 一眼可见，不必去猜工作流里发生了什么。
      - name: 记录签名状态
        run: |
          {
            echo "## 构建结果"
            echo ""
            if [ "${{ steps.keystore.outputs.signed }}" = "true" ] && [ "${{ steps.keystore.outputs.selftest }}" != "true" ]; then
              echo "- ✅ **Release APK 已用固定 keystore 签名**，可覆盖升级。"
            elif [ "${{ steps.keystore.outputs.selftest }}" = "true" ]; then
              echo "- 🧪 **签名自检构建**：用一次性测试 keystore 验证了签名流水线是通的。"
              echo "  **此产物不可分发**（证书是临时的）。配置 4 个 secret 后重新构建即可出正式包。"
            else
              echo "- ⚠️ **未配置签名密钥**，Release APK 退回了 debug 签名。"
              echo "  这种 APK **每次构建签名都不同**，装新版本前必须先卸载旧版本，"
              echo "  本地数据与 ntfy 订阅都会丢失。正式分发前请配置 4 个 secret。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
